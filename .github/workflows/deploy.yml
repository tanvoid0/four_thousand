name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; let a running one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --base makes asset paths work from https://<user>.github.io/<repo>/
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          # Optional: set these as repo secrets to bake YOUR life into the build.
          # Leave unset and the site ships as a random demo.
          VITE_PROFILE: ${{ secrets.VITE_PROFILE }}
          VITE_BIRTHDATE: ${{ secrets.VITE_BIRTHDATE }}
          VITE_NAME: ${{ secrets.VITE_NAME }}
          VITE_LIFESPAN: ${{ secrets.VITE_LIFESPAN }}
          VITE_EVENTS: ${{ secrets.VITE_EVENTS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
