name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; let a running one finish. PR checks get their own group so one
# can never queue behind a deploy or replace a pending deploy of main
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # checks gate the deploy: a failure stops this job, so `deploy` never starts
      - run: npm run typecheck
      - run: npm test
      # --base makes asset paths work from https://<user>.github.io/<repo>/
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          # Optional: set these as repo secrets to bake YOUR life into the build.
          # Leave unset and the site ships as a random demo.
          VITE_PROFILE: ${{ secrets.VITE_PROFILE }}
          VITE_BIRTHDATE: ${{ secrets.VITE_BIRTHDATE }}
          VITE_NAME: ${{ secrets.VITE_NAME }}
          VITE_LIFESPAN: ${{ secrets.VITE_LIFESPAN }}
          VITE_EVENTS: ${{ secrets.VITE_EVENTS }}
      # Pages side effects (self-enable, artifact) are deploy-only: PR runs stop after the build
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          # self-enable Pages on first run so a fresh clone/fork needs no
          # manual toggle (the job's pages: write permission allows this)
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Keep the repo's homepage pointing at the live demo. GITHUB_TOKEN can't edit repo
      # settings, so this needs a PAT with repo admin in the HOMEPAGE_TOKEN secret;
      # without it the step is skipped.
      - name: Link demo as repo homepage
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HOMEPAGE_TOKEN }}
          DEMO_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh repo edit "$GITHUB_REPOSITORY" --homepage "$DEMO_URL"
          else
            echo "HOMEPAGE_TOKEN not set; skipping"
          fi
